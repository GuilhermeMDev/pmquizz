<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="100%" height="auto" style="max-width: 450px; display: block; margin: 10px auto; background: #ffffff; border-radius: 8px; border: 1px solid #ccc;">
  <!-- Placa / Peça -->
  <rect x="50" y="20" width="400" height="150" fill="#f8f9fa" stroke="#333333" stroke-width="2"/>
  
  <!-- Cordão de Solda (faixa central) -->
  <line x1="50" y1="70" x2="450" y2="70" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="50" y1="120" x2="450" y2="120" stroke="#555555" stroke-width="1.5" stroke-dasharray="4,2"/>
  
  <!-- Rótulo Cordão de Solda -->
  <text x="5" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">cordão de</text>
  <text x="18" y="106" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333333">solda</text>
  <path d="M 42 98 L 52 98" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- 1: Indicação Arredondada fora/borda do cordão -->
  <g>
    <circle cx="110" cy="95" r="14" fill="none" stroke="#b71c1c" stroke-width="2"/>
    <path d="M 104 95 L 116 95 M 110 89 L 110 101" stroke="#b71c1c" stroke-width="1.5"/>
    <text x="106" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">1</text>
    <line x1="110" y1="62" x2="110" y2="78" stroke="#000" stroke-width="1.2"/>
  </g>
  
  <!-- 2: Trinca Transversal (Linear) cortando o cordão -->
  <g>
    <path d="M 215 50 Q 218 70 213 95 T 217 140" fill="none" stroke="#b71c1c" stroke-width="3"/>
    <text x="212" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">2</text>
    <line x1="216" y1="150" x2="216" y2="142" stroke="#000" stroke-width="1.2"/>
  </g>
  
  <!-- 3: Indicação Linear Longitudinal -->
  <g>
    <line x1="290" y1="85" x2="335" y2="85" stroke="#b71c1c" stroke-width="3.5" stroke-linecap="round"/>
    <text x="308" y="55" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">3</text>
    <line x1="312" y1="62" x2="312" y2="78" stroke="#000" stroke-width="1.2"/>
  </g>
  
  <!-- 4: Ponto Arredondado pequeno -->
  <g>
    <circle cx="330" cy="108" r="6" fill="#b71c1c"/>
    <text x="345" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">4</text>
    <line x1="343" y1="126" x2="335" y2="114" stroke="#000" stroke-width="1.2"/>
  </g>
  
  <!-- 5: Indicação Linear / Alongada -->
  <g>
    <ellipse cx="400" cy="110" rx="22" ry="7" fill="none" stroke="#b71c1c" stroke-width="2"/>
    <text x="396" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000">5</text>
    <line x1="400" y1="132" x2="400" y2="120" stroke="#000" stroke-width="1.2"/>
  </g>
  
  <!-- Legenda Fig. 1 -->
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333">Fig. 1</text>
</svg>
