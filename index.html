<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Offshore - Simulado</title>
    <style>
        body { 
            background-color: #121212; 
            color: #e0e0e0; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 0;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* Container Principal - Ajustado para não ficar "espalhado" no PC */
        #quiz-container { 
            width: 100%; 
            max-width: 700px; /* Largura ideal para leitura */
            background: #1e1e1e; 
            padding: 20px; 
            margin-top: 10px;
            margin-bottom: 100px; /* Espaço para a barra fixa */
            border-radius: 0 0 16px 16px; /* Arredondado só embaixo no mobile */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); 
            box-sizing: border-box; 
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
            #quiz-container {
                border-radius: 16px; /* Arredondado total no PC */
                margin-top: 20px;
                padding: 40px;
            }
        }

        /* PLACAR */
        .header-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: #252525;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .score-box { display: flex; gap: 15px; }

        .badge {
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge-green { background: rgba(46, 125, 50, 0.2); color: #81c784; border: 1px solid #2e7d32; }
        .badge-red { background: rgba(198, 40, 40, 0.2); color: #e57373; border: 1px solid #c62828; }

        .pergunta { 
            font-size: 19px; 
            line-height: 1.6; 
            margin-bottom: 25px; 
            color: #ffffff;
            font-weight: 500;
        }
        
        /* BOTÕES DE OPÇÃO */
        .opcao { 
            display: block; 
            width: 100%; 
            padding: 16px 20px; 
            margin: 12px 0; 
            background: #2c2c2c; 
            border: 1px solid #444; 
            color: #e0e0e0; 
            border-radius: 10px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 17px; 
            transition: all 0.2s ease;
            position: relative;
        }
        
        .opcao:hover:not(:disabled) { background: #383838; border-color: #666; transform: translateX(5px); }
        .opcao:active:not(:disabled) { transform: scale(0.98); }
        
        /* ESTILOS DE RESPOSTA (USADOS QUANDO VOLTA NA QUESTÃO) */
        .opcao:disabled { cursor: default; opacity: 1; color: #bbb; }
        
        .resposta-certa { 
            background-color: #1b5e20 !important; 
            border-color: #4caf50 !important; 
            color: white !important;
        }
        
        .resposta-errada { 
            background-color: #b71c1c !important; 
            border-color: #ef5350 !important;
            opacity: 0.7;
        }

        /* Marcador visual de seleção */
        .resposta-certa::after { content: "✅"; position: absolute; right: 15px; }
        .resposta-errada::after { content: "❌"; position: absolute; right: 15px; }

        #feedback { 
            margin-top: 20px; 
            padding: 15px;
            border-radius: 8px;
            text-align: center; 
            font-size: 18px; 
            background: #252525;
            display: none; /* Escondido por padrão */
        }

        /* BARRA DE NAVEGAÇÃO */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #181818;
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8);
            z-index: 100;
            border-top: 1px solid #333;
        }

        .nav-btn {
            background: #333;
            color: white;
            border: 1px solid #444;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
            max-width: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-btn:hover { background: #444; }
        .nav-btn:active { transform: scale(0.95); }

        .timer-on { background-color: #1b5e20; border-color: #2e7d32; color: #a5d6a7; }
        .timer-off { background-color: #222; color: #666; border-style: dashed; }
        
        .btn-next { background-color: #0d47a1; border-color: #1565c0; font-weight: bold; }
        .btn-next:hover { background-color: #1565c0; }

    </style>
</head>
<body>
    <div id="quiz-container">
        <div class="header-stats">
            <span id="progresso" style="color: #aaa; font-weight: 500;">Carregando...</span>
            <div class="score-box">
                <span class="badge badge-green">✔ <span id="acertos">0</span></span>
                <span class="badge badge-red">✖ <span id="erros">0</span></span>
            </div>
        </div>

        <div id="pergunta-texto" class="pergunta">...</div>
        
        <div id="opcoes-container"></div>
        
        <div id="feedback"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="navegar(-1)">⬅️</button>
        
        <button id="btn-timer" class="nav-btn timer-off" onclick="alternarTimer()" style="flex: 0.6;">
            ⏰ Off
        </button>
        
        <button class="nav-btn btn-next" onclick="navegar(1)">➡️</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
