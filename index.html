<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Offshore - Simulado</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #quiz-container { width: 100%; maxWidth: 600px; background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .stats { display: flex; justify-content: space-between; font-size: 14px; color: #aaa; margin-bottom: 20px; }
        .pergunta { font-size: 18px; line-height: 1.5; margin-bottom: 25px; }
        .opcao { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 8px; cursor: pointer; text-align: left; font-size: 16px; }
        .opcao:hover { background: #444; }
        #feedback { margin-top: 20px; font-weight: bold; text-align: center; font-size: 20px; }
    </style>
</head>
<body>
    <div id="quiz-container">
        <div class="stats">
            <span id="progresso">Carregando...</span>
            <span id="acertos">Acertos: 0</span>
        </div>
        <div id="pergunta-texto" class="pergunta">Aguarde, preparando questões...</div>
        <div id="opcoes-container"></div>
        <div id="feedback"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
